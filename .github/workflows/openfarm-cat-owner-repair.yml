name: CatMeows owner holdout repair
on:
  push:
    branches: [research/system1-reboot-2026-10]
    paths: [scripts/verify_cat_owner_repair.py, .github/workflows/openfarm-cat-owner-repair.yml]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'datasets>=4.5.0' 'huggingface_hub>=1.0.0'
      - name: Validate owner/cat/audio-disjoint v2 source views
        run: python scripts/verify_cat_owner_repair.py
