name: OpenFARM pig social and lesion data audit
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/audit_pig_social_ethogram.py
      - .github/workflows/openfarm-pig-social-audit.yml
  workflow_dispatch:
jobs:
  inspect-ethogram:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' requests
      - run: python scripts/audit_pig_social_ethogram.py --output audit-reports/pig-social-ethogram.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pig-social-source-evidence
          path: audit-reports/pig-social-ethogram.json
          retention-days: 30
