name: Welfare sprint 50-farm clinical risk decision benchmark
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/benchmark_brazil_cow_welfare.py
      - .github/workflows/openfarm-brazil-cow-welfare-benchmark.yml
  workflow_dispatch:
jobs:
  heldout-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' 'scikit-learn>=1.4,<1.8' numpy requests
      - name: Test two independent clinical reference families on unseen farms
        run: python scripts/benchmark_brazil_cow_welfare.py --out reports/heldout-clinical-cows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brazil-cows-heldout-welfare-decisions
          path: reports/heldout-clinical-cows.json
          retention-days: 30
