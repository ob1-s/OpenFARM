name: Welfare sprint cow clinical label and rights validation
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/validate_brazil_cow_welfare_targets.py
      - .github/workflows/openfarm-brazil-cow-welfare-targets.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' requests
      - run: python scripts/validate_brazil_cow_welfare_targets.py --out reports/brazil-cows-welfare-target-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brazil-cow-welfare-target-validation
          path: reports/brazil-cows-welfare-target-validation.json
          retention-days: 30
