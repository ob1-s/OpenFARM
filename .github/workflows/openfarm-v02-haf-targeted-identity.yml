name: OpenFARM HAF original pixel ID targeted repair (1,4,9)
on:
  push:
    branches: [research/openfarm-next-evidence-calibration-2026-10]
    paths:
      - scripts/index_v02_haf_targeted_identity.py
      - .github/workflows/openfarm-v02-haf-targeted-identity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-pixel-link-three:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "remotezip>=0.12,<1.0" "requests>=2.31,<3" "pillow>=10"
      - name: MD5-pin original media and check 3 omitted video IDs without relaxing pixel criterion
        run: python scripts/index_v02_haf_targeted_identity.py
      - name: Publish original-frame linkage statistics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haf-original-605-three-unmatched-targeted-link
          path: reports/source_gates/haf2024_three_video_targeted_match.json
          retention-days: 30
          if-no-files-found: ignore
