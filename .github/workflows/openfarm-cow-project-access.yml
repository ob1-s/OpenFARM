name: Cow ten-rater video archive access verification
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths: [scripts/audit_cow_project_access.py, .github/workflows/openfarm-cow-project-access.yml]
  workflow_dispatch:
jobs:
  inspect-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/audit_cow_project_access.py --out reports/cow-project-access.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cow-ten-rater-raw-link-probe
          path: reports/cow-project-access.json
          retention-days: 30
