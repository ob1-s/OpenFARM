endpoints_path = "../endpoints.toml"

num_examples = 36
rollouts_per_example = 4
max_concurrent = 32
max_retries = 5

save_results = true

[[ablation]]
env_id = "openfarm-zoo-arousal-eval"

[ablation.env_args]
task = "valence"
modality = "filmstrip"
include_species_context = true
require_explanation = true
max_examples_per_task = 36
seed = 42

[ablation.sweep]
endpoint_id = [
    "Qwen/Qwen3.5-2B",
    "google/gemini-3-flash-preview",
]
sampling_args = [
    { extra_body = { chat_template_kwargs = { enable_thinking = false } } },
]