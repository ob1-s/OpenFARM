name: EquiFACS independent veterinarian heldout task build
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths: [scripts/build_equifacs_clinical_v0.py, .github/workflows/openfarm-equifacs-bounded-task.yml]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' requests openpyxl
      - run: python scripts/build_equifacs_clinical_v0.py --report audit-reports/equifacs-limited-task.json --local-dir /tmp/equifacs-source-private
      - name: Verify actual separate local inputs and provenance
        run: |
          test -s /tmp/equifacs-source-private/train.decision.jsonl
          test -s /tmp/equifacs-source-private/calibration.decision.jsonl
          test -s /tmp/equifacs-source-private/test.decision.jsonl
          test -s /tmp/equifacs-source-private/test.provenance.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equifacs-limited-vet-binary-manifest
          path: audit-reports/equifacs-limited-task.json
          retention-days: 30
