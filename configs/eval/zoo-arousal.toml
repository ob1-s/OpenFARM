endpoints_path = "../endpoints.toml"
model = "google/gemini-3-flash-preview" # vision/video-capable model
num_examples = 3
rollouts_per_example = 3
max_concurrent = 32
max_retries = 2

save_results = true

[[ablation]]
env_id = "openfarm-zoo-arousal-eval"

[ablation.env_args]
max_examples = 3
require_explanation = true
include_species_context = false
seed = 42

[ablation.sweep.env_args]
modality = [
    "filmstrip",
    "text",
    # "video",
]
task = ["valence_arousal"]