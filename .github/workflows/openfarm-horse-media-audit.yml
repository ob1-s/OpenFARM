name: Horse media duplicate validation
on:
  push:
    branches: [research/system1-reboot-2026-10]
    paths: [scripts/verify_horse_duplicates.py, .github/workflows/openfarm-horse-media-audit.yml]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'datasets>=4.5.0' 'huggingface_hub>=1.0.0'
      - name: Verify actual horse image-byte and region/label duplicate semantics
        run: python scripts/verify_horse_duplicates.py
