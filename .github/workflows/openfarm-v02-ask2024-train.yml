name: OpenFARM original EquiFACS 348-video L2 specialists
on:
  push:
    branches: [research/openfarm-next-evidence-calibration-2026-10]
    paths:
      - scripts/index_v02_ask2024_train_facs.py
      - .github/workflows/openfarm-v02-ask2024-train.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-independent-equine-pain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight CPU probabilistic training
        run: python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.5,<2"
      - name: Train video-feature System1 heads using original 348 sequences and eight-horse group split
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        run: python scripts/index_v02_ask2024_train_facs.py
      - name: Preserve source-provenance, per-horse metrics and comparative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask2024-348video-horse-grouped-systemone-baselines
          path: reports/decision-index/v02_ask2024_348_equifacs_specialists.json
          if-no-files-found: ignore
          retention-days: 30
