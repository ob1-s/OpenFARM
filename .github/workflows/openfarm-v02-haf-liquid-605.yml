name: OpenFARM independent equine L2 all-605 original-image Liquid
on:
  push:
    branches: [research/openfarm-next-evidence-calibration-2026-10]
    paths:
      - scripts/index_v02_haf_liquid_605.py
      - .github/workflows/openfarm-v02-haf-liquid-605.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-equine-painface-visual-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original media and model dependencies
        run: |
          python -m pip install 'pillow>=10' 'requests>=2.31' 'huggingface_hub>=0.34'
          mkdir -p models
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download('LiquidAI/d1-omni-600M-GGUF',filename='d1-omni-600M-Q8_0.gguf',local_dir='models'); hf_hub_download('LiquidAI/d1-omni-600M-GGUF',filename='mmproj-d1-omni-600M-Q8_0.gguf',local_dir='models')"
      - name: Compile actual Liquid native CPU multimodal decision server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF
          cmake --build llama.cpp/build --target llama-server -j 4
      - name: Evaluate all 605 original expert-rated equine face images
        run: |
          ./llama.cpp/build/bin/llama-server -m models/d1-omni-600M-Q8_0.gguf --mmproj models/mmproj-d1-omni-600M-Q8_0.gguf --no-mmproj-offload -c 8192 -b 8192 -ub 8192 -t 4 --host 127.0.0.1 --port 8080 >/tmp/openfarm_horse_l2_model.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for i in range(150):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health",timeout=2) as r:
                      if r.status==200:break
              except Exception:pass
              time.sleep(2)
          else:raise RuntimeError("The actual multimodal model did not load")
          print("OPENFARM_HAF_ORIGINAL_IMAGE_CPU_READY")
          PY
          python scripts/index_v02_haf_liquid_605.py
      - name: Export score aggregates only, never copyrighted images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haf605-liquid-actual-visual-decisions
          path: reports/decision-index/v02_haf605_liquid_original_images.json
          retention-days: 30
          if-no-files-found: ignore
