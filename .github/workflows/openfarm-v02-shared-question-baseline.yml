name: OpenFARM v0.2 shared multi-question System-1 baseline
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/benchmark_hotpig_shared_queries_v02.py
      - tests/test_openfarm_shared_queries_v02.py
      - .github/workflows/openfarm-v02-shared-question-baseline.yml
  workflow_dispatch:
jobs:
  shared-head:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' numpy scikit-learn requests
      - name: Validate question-conditioned rows and valid masks (offline)
        run: python -m unittest discover -s tests -p 'test_openfarm_shared_queries_v02.py' -v
      - uses: actions/cache@v4
        with:
          path: .cache/hotpig/series.zip
          key: hotpig-17090997-series-1ba5125167224b96-v1
      - name: Compare ONE shared binary decision head to separate question heads
        env:
          OPENFARM_HOTPIG_SOURCE_PATH: .cache/hotpig/series.zip
        run: python scripts/benchmark_hotpig_shared_queries_v02.py --report reports/v02-hot-pig-shared-question.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfarm-v02-shared-question-eval
          path: reports/v02-hot-pig-shared-question.json
          retention-days: 30
