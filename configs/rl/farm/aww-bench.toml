model = "Qwen/Qwen3.5-0.8B"
max_steps = 150
learning_rate = 1e-5
batch_size = 512
rollouts_per_example = 16

[sampling]
max_tokens = 2048
temperature = 1.0
enable_thinking = true

[[env]]
id = "hfarm/aww-bench"

[env.args]
# Train on non-adversarial context using the policy as judge.
judge_mode = "none"
include_adversarial_context = false
require_reasoning = false
format_reward_weight = 0.2

[eval]
interval = 25
num_examples = -1
rollouts_per_example = 3
eval_base_model = true

[[eval.env]]
id = "hfarm/aww-bench"
name = "aww-adversarial"

[eval.env.args]
# Evaluate on adversarial context for exact-match accuracy on target category
judge_mode = "none"
include_adversarial_context = true
require_reasoning = false

[[eval.env]]
id = "hfarm/aww-bench"
name = "aww-non-adversarial"

[eval.env.args]
# Evaluate on non-adversarial context for exact-match accuracy on target category
judge_mode = "none"
include_adversarial_context = false
require_reasoning = false

