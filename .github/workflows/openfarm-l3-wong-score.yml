name: Wong 102-case private Jev ordinal Score ablation
on:
  push:
    branches: [research/index-l3-veterinary-triage-2026-10]
    paths:
      - scripts/index_l3_wong_jev_score_private.py
      - .github/workflows/openfarm-l3-wong-score.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wong-score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare 1.13 and 1.14 ordinal Score on frozen 102-case Wong split
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          WONG_TEST_CASES_B64: ${{ secrets.WONG_TEST_CASES_B64 }}
        run: python scripts/index_l3_wong_jev_score_private.py
      - name: Publish only original-source aggregate statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wong-jev-score-aggregate
          path: reports/index_l3_vet/wong_jev_score_secret_aggregate.json
          retention-days: 14
          if-no-files-found: ignore
