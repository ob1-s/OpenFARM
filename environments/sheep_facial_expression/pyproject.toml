[project]
name = "sheep-facial-expression"
description = "Sheep Facial Expression Benchmark - Binary pain assessment."
tags = ["animal-behavior", "animal-welfare", "livestock", "vision", "multimodal", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.11",
    "Pillow>=12.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["sheep_facial_expression.py", "pyproject.toml"] 

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
