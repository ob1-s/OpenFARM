name: OpenFARM CPU Julia-1 real-weight veterinary decisions
on:
  push:
    branches: [research/index-l3-veterinary-triage-2026-10]
    paths:
      - .github/workflows/openfarm-cpu-julia-vet.yml
      - scripts/index_l3_cpu_julia_evaluate.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  julia-real-weight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JULIA_CPU_THREADS: "4"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official PyTorch CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<2.15"
          python -m pip install "huggingface_hub>=0.34" "transformers>=5.0,<5.1" "safetensors>=0.5" "numpy>=1.26" "requests>=2.31,<3" "openpyxl>=3.1,<4"
      - name: Download exact original public Julia-1 weights and runtime
        run: |
          python -c "from huggingface_hub import snapshot_download; p=snapshot_download('SupersonicLabs/Julia-1', local_dir='Julia-1'); print('Original SupersonicLabs/Julia-1 downloaded to',p)"
          python -m pip install -e ./Julia-1 --no-deps
      - name: Rebuild original Farrow vignette reference from verified public sources
        run: python scripts/index_l3_farrow_builder.py
      - name: Genuine Julia-1 CPU inference on 30 original Farrow cases
        run: python scripts/index_l3_cpu_julia_evaluate.py --task farrow
      - name: Genuine Julia-1 CPU inference on 102 original Wong heldout cases
        env:
          WONG_TEST_CASES_B64: ${{ secrets.WONG_TEST_CASES_B64 }}
        run: python scripts/index_l3_cpu_julia_evaluate.py --task wong
      - name: Preserve aggregate clinical-reference metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-julia1-cpu-wong-farrow
          path: |
            reports/index_l3_vet/cpu_julia_farrow_choice.json
            reports/index_l3_vet/cpu_julia_wong_choice.json
          retention-days: 14
          if-no-files-found: ignore
