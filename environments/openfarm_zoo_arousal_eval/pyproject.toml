[project]
name = "openfarm-zoo-arousal-eval"
description = "OpenFARM visual affect benchmark for expert-coded zoo animal arousal and valence"
tags = ["openfarm", "animal-welfare", "zoo-animals", "visual-affect", "video", "vision", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18.0",
    "Pillow>=10.0.0",
    "verifiers==0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["openfarm_zoo_arousal_eval.py", "pyproject.toml", "README.md"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
