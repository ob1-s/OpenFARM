endpoints_path = "../endpoints.toml"

num_examples = -1
rollouts_per_example = 3
max_concurrent = 32
max_retries = 20

save_results = true

[[ablation]]
env_id = "openfarm-aww"

[ablation.env_args]
require_explanation = true
max_examples_per_task = -1
judge_mode = "none" 
include_adversarial_context = true

[ablation.sweep]
endpoint_id = [
    # "Qwen/Qwen3.5-2B",
    # "google/gemini-3-flash-preview",
    "gemma-4-E2B-it",
    # "gemma-4-E4B-it",
]
sampling_args = [
    { extra_body = { chat_template_kwargs = { enable_thinking = false } } },
    # { extra_body = { chat_template_kwargs = { enable_thinking = true } } }
]