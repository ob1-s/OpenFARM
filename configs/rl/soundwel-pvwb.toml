model = "google/gemma-4-E2B-it"
max_steps = 200
batch_size = 128
rollouts_per_example = 8
learning_rate = 5e-6
max_async_level = 2

[sampling]
max_tokens = 64
temperature = 1.2

[[env]]
id = "hfarm/soundwel-pvwb" 
args = { task = "all", modality = "audio", require_reasoning = true }

[eval]
interval = 25
num_examples = 200
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
id = "hfarm/soundwel-pvwb"
args = { task = "all", modality = "audio", require_reasoning = true }