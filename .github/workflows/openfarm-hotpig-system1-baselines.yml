name: HotPig cheap System-1 learned baselines
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/benchmark_hotpig_system1.py
      - scripts/evaluate_hotpig_feeder_candidate.py
      - .github/workflows/openfarm-hotpig-system1-baselines.yml
  workflow_dispatch:
jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' numpy scikit-learn requests
      - uses: actions/cache@v4
        with:
          path: .cache/hotpig/series.zip
          key: hotpig-17090997-series-1ba5125167224b96-v1
      - name: Evaluate rule logistic and tree at strictly pig-heldout test
        env:
          OPENFARM_HOTPIG_SOURCE_PATH: .cache/hotpig/series.zip
        run: python scripts/benchmark_hotpig_system1.py --out reports/hotpig-cheap-baselines.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotpig-cheap-system1-baselines
          path: reports/hotpig-cheap-baselines.json
          retention-days: 30
