# Global defaults for all combinations
num_examples = 50            # Sample size per tier
rollouts_per_example = 3     # 0-shot pass@3 evaluation
save_results = true          # Ensure it saves locally and uploads to Hub
max_concurrent = 256
max_retries = 5

endpoint_id = "gemma-4-E2B-it"

[[ablation]]
env_id = "soundwel-pvwb"

[ablation.sweep.env_args]
modality = ["audio", "vision"]

system_prompt_override = [
    # 1. The default baseline
    "You are an expert ethologist specializing in swine welfare and vocalization analysis.",
    
    # 2. The Cheat Code
    # "You are an expert ethologist specializing in swine welfare and vocalization analysis. CRITICAL ACOUSTIC RULES FOR THIS TASK: 1) Positive calls are consistently SHORTER in duration than negative calls. 2) Positive calls have a LOWER Amplitude Modulation Rate. Listen carefully to the length of the audio and the amplitude modulation to determine if it is Positive or Negative."
]