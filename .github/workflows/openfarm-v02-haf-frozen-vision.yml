name: OpenFARM original equine L2 frozen-vision specialist
on:
  push:
    branches: [research/openfarm-next-evidence-calibration-2026-10]
    paths:
      - scripts/index_v02_haf_train_frozen_visual.py
      - benchmarks/decision-index/v0.2/haf2024-video-horse-id-map.json
      - .github/workflows/openfarm-v02-haf-frozen-vision.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-imagenet-visual-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native PyTorch CPU and vision reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchvision==0.21.0"
          python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.5,<2" "pillow>=10"
      - name: Original media MD5, animal-grouped split, frozen visual head and shortcut controls
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        run: python scripts/index_v02_haf_train_frozen_visual.py
      - name: Publish only grouped aggregate metrics and source identity status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-haf605-frozen-vision-specialist
          path: reports/decision-index/v02_haf605_cpu_specialist.json
          retention-days: 30
          if-no-files-found: ignore
