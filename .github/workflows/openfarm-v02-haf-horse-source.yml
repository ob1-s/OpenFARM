name: OpenFARM independent L2 horse pain-face source gate
on:
  push:
    branches: [research/openfarm-next-evidence-calibration-2026-10]
    paths:
      - scripts/source_gate_haf_2024_horse_images.py
      - .github/workflows/openfarm-v02-haf-horse-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-horse-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'pillow>=10,<13'
      - name: Validate original HAF 2024 horse images and expert binary source labels
        run: python scripts/source_gate_haf_2024_horse_images.py
      - name: Preserve aggregate original-file metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAF-2024-equine-original-L2-source-proof
          path: reports/source_gates/haf2024_horse_original_expert_images.json
          retention-days: 30
          if-no-files-found: ignore
