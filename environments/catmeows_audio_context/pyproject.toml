[project]
name = "catmeows-audio-context"
description = "Feline audio context classification evaluating a model's ability to identify the eliciting context (`brushing`, `isolation`, `waiting for food`) from cat vocalizations."
tags = ["animal-behavior", "animal-welfare", "bioacoustics", "feline", "audio", "multimodal", "single-turn", "eval", "train"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["catmeows_audio_context.py", "pyproject.toml"] 

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
