name: OpenFARM v0.1 real Liquid multi-frame broiler pilot
on:
  push:
    branches: [research/decision-index-v01-2026-10]
    paths:
      - scripts/index_v01_big_broiler_multiframe_pilot.py
      - .github/workflows/openfarm-index-v01-broiler-multiframe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  liquid-multiimage-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video decode and source-range dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install 'requests>=2.31,<3' 'remotezip>=0.12,<1.0' 'huggingface_hub>=0.34'
          mkdir -p models
          python -c "from huggingface_hub import hf_hub_download; print(hf_hub_download('LiquidAI/d1-omni-600M-GGUF',filename='d1-omni-600M-Q8_0.gguf',local_dir='models'))"
      - name: Compile real native decision-head Liquid CPU server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF
          cmake --build llama.cpp/build --target llama-server -j 4
      - name: Six predeclared original 10s chicken video decisions from sampled frames
        run: |
          ./llama.cpp/build/bin/llama-server -m models/d1-omni-600M-Q8_0.gguf -c 16384 -b 16384 -ub 16384 -t 4 --host 127.0.0.1 --port 8080 >/tmp/openfarm-d1-multiframe-server.log 2>&1 &
          S=$!
          trap 'kill "$S" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for i in range(120):
            try:
              with urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2) as r:
                if r.status==200:break
            except Exception:pass
            time.sleep(2)
          else:raise RuntimeError('Native d1 multimodal server failed to start')
          print('LIQUID_MULTIMODAL_SERVER_READY')
          PY
          python scripts/index_v01_big_broiler_multiframe_pilot.py
      - name: Preserve aggregate and non-media case scores, never video frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-broiler-six-window-liquid-multiframe-pilot
          path: reports/decision-index/broiler_real_multiframe_d1_pilot.json
          if-no-files-found: ignore
          retention-days: 14
