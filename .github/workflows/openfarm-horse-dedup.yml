name: Horse unique-source repair
on:
  push:
    branches: [research/system1-reboot-2026-10]
    paths: [scripts/prepare_horse_unique.py, .github/workflows/openfarm-horse-dedup.yml]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'datasets>=4.5.0' 'huggingface_hub>=1.0.0'
      - name: Generate independently verifiable deduplicated horse membership manifest
        run: python scripts/prepare_horse_unique.py --manifest reports/horse-v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfarm-horse-dedup-manifest
          path: reports/horse-v2.json
          retention-days: 30
