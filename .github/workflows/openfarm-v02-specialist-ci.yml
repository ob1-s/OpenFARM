name: OpenFARM next-phase source freeze and specialist reproducibility
on:
  push:
    branches: [research/openfarm-next-evidence-calibration-2026-10]
    paths:
      - scripts/wong_benchmark.py
      - scripts/index_v02_train_rater_conditioned.py
      - tests/test_wong_v02_source_freeze.py
      - benchmarks/decision-index/v0.2/**
      - .github/workflows/openfarm-v02-specialist-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-training-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original source parser and split on synthetic cases
        run: python -m unittest discover -s tests -p test_wong_v02_source_freeze.py -v
      - name: Install actual small-model CPU training dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'scikit-learn>=1.5,<2'
      - name: Compile exact trainer and check CLI without exposing patients
        run: |
          python -m py_compile scripts/index_v02_train_rater_conditioned.py scripts/wong_benchmark.py
          python scripts/index_v02_train_rater_conditioned.py --help
      - name: Verify external task candidate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmarks/decision-index/v0.2/candidates.json')
          if p.exists():
            j=json.loads(p.read_text())
            assert j['status']=='PRE_ADMISSION' and len(j['candidates'])>=2
            print('V02_CANDIDATE_CONTRACT',len(j['candidates']))
          else:
            print('V02_CANDIDATE_MANIFEST_NOT_YET_CREATED')
          PY
