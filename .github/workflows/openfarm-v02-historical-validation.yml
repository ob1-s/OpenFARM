name: OpenFARM historical query validity and cheap multi-question baselines
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/build_openfarm_decision_queries_v02.py
      - scripts/benchmark_pigweb_future_biomarkers_v02.py
      - scripts/benchmark_hotpig_historical_v02.py
      - scripts/validate_temporal_contract_v02.py
      - tests/test_openfarm_historical_v02.py
      - .github/workflows/openfarm-v02-historical-validation.yml
  workflow_dispatch:
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_openfarm_historical_v02.py' -v
  pigweb:
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' numpy scikit-learn
      - name: Compare PRE-only multi-assay baselines by held-out research institute
        run: python scripts/benchmark_pigweb_future_biomarkers_v02.py --report reports/pigweb-pre-only-baselines.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pigweb-preonly-historical-validation
          path: reports/pigweb-pre-only-baselines.json
          retention-days: 30
  hotpig:
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' numpy scikit-learn requests
      - uses: actions/cache@v4
        with:
          path: .cache/hotpig/series.zip
          key: hotpig-17090997-series-1ba5125167224b96-v1
      - name: Evaluate multiple distinct measured current/future feeder decisions
        env:
          OPENFARM_HOTPIG_SOURCE_PATH: .cache/hotpig/series.zip
        run: python scripts/benchmark_hotpig_historical_v02.py --report reports/hotpig-current-future-baselines.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotpig-historical-multiquestion-validation
          path: reports/hotpig-current-future-baselines.json
          retention-days: 30
