name: OpenFARM external equine 2020 FACS supplemental source gate
on:
  push:
    branches: [research/openfarm-next-evidence-calibration-2026-10]
    paths:
      - scripts/source_gate_rashid_2020_equifacs.py
      - .github/workflows/openfarm-v02-external-equiFACS-2020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-workbooks-and-video-range:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source spreadsheet reader
        run: python -m pip install "openpyxl>=3.1,<4"
      - name: Inspect original published experimental and clinical XLSX, probe video media safely
        run: python scripts/source_gate_rashid_2020_equifacs.py
      - name: Keep only metadata and source SHA hashes, never clinical data or media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equifacs-2020-original-supplement-source-gate
          path: reports/source_gates/rashid_2020_equifacs_original_workbooks.json
          retention-days: 30
          if-no-files-found: ignore
