name: Veterinary original dataset access probe
on:
  push:
    branches: [research/index-l3-veterinary-triage-2026-10]
    paths:
      - scripts/index_l3_vet_access_probe.py
      - .github/workflows/openfarm-l3-vet-data-access.yml
  workflow_dispatch:
jobs:
  source-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only HTTP client
        run: python -m pip install 'requests>=2.31,<3'
      - name: Test official original-source file download endpoints
        run: python scripts/index_l3_vet_access_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-vet-data-access-results
          path: reports/index_l3_vet_access_probe.json
          retention-days: 7
