[project]
name = "openfarm-horse-grimace"
description = "Horse Grimace Scale-style facial-region pain scoring benchmark."
tags = ["animal-welfare", "horse", "equine", "facial-expression", "grimace-scale", "pain-assessment", "vision", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers==0.1.14",
    "Pillow>=12.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "openfarm_horse_grimace/**/*",
    "pyproject.toml",
    "README.md",
]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
