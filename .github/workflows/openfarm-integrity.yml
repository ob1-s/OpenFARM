name: OpenFARM integrity (offline smoke)
on:
  pull_request:
  push:
    branches: [research/system1-reboot-2026-10]
  workflow_dispatch:

jobs:
  fixture-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline split/group fixture tests
        run: python -m unittest discover -s tests -p 'test_audit_openfarm_integrity.py' -v

  bioacoustics-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bioacoustics environment
        run: python -m pip install -e environments/openfarm_bioacustics
      - name: Verify fail-closed split and strict answers
        run: python -m unittest discover -s environments/openfarm_bioacustics/tests -v

  all-environments-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install six pinned OpenFARM environments
        run: |
          python -m pip install -e environments/openfarm_aww -e environments/openfarm_bioacustics -e environments/openfarm_dog_pain_triage -e environments/openfarm_horse_grimace -e environments/openfarm_sheep_apr -e environments/openfarm_zoo_arousal_eval
      - name: Import and construct each environment (no Hub access)
        run: python scripts/smoke_env_construction.py
