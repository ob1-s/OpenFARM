name: OpenFARM published HF integrity audit
on:
  push:
    branches: [research/system1-reboot-2026-10]
    paths:
      - ".github/workflows/openfarm-hf-audit.yml"
      - "scripts/audit_openfarm_integrity.py"
      - "scripts/diagnose_ungulate_groups.py"
  workflow_dispatch:

jobs:
  audit:
    name: "Published splits: ${{ matrix.dataset }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [horse, sheep, dog, cat, hen, ungulate, zoo, aww, soundwel]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal Hub data dependencies
        run: python -m pip install 'datasets>=4.5.0' 'huggingface_hub>=1.0.0'
      - name: Audit entire published splits at a pinned revision
        id: scan
        shell: bash
        run: |
          set +e
          python scripts/audit_openfarm_integrity.py --dataset "${{ matrix.dataset }}" --output "audit-reports/${{ matrix.dataset }}.json"
          rc=$?
          echo "audit_exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ -f "audit-reports/${{ matrix.dataset }}.json" ]; then
            python -c "import json;d=json.load(open('audit-reports/${{ matrix.dataset }}.json')); print('DATA AUDIT:',d['dataset'],d['revision'],d['status']);print('SPLITS:',d['stats']);print('FINDINGS:',d['findings']);print('AUDIO_SHA_VALIDATION:',d.get('audio_sha256_validation'))"
          fi
          # 0=bounded checks passed; 3=incomplete evidence (expected for some sets).
          # 2=proven integrity failure; any other nonzero is a load/runtime error.
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then exit 0; fi
          exit "$rc"
      - name: Upload data-integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "openfarm-hf-${{ matrix.dataset }}"
          path: "audit-reports/${{ matrix.dataset }}.json"
          if-no-files-found: warn
          retention-days: 14

  ungulate-components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned-data client
        run: python -m pip install 'datasets>=4.5.0' 'huggingface_hub>=1.0.0'
      - name: Diagnose whether duplicate clips connect supposedly held-out animals
        run: python scripts/diagnose_ungulate_groups.py --output audit-reports/ungulate-components.json
      - name: Retain component diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfarm-ungulate-component-graph
          path: audit-reports/ungulate-components.json
          retention-days: 14
