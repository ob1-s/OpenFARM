[project]
name = "openfarm-aww"
description = "Adversarial Animal Welfare Watcher: Single-turn evaluation environment testing a model's ability to classify animal welfare states while reasoning through biological confounders and adversarial distractors."
tags = ["animal-behavior", "animal-welfare", "livestock", "automated-pain-recognition", "llm-judge", "self-judge", "single-turn", "reasoning", "eval", "train"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["openfarm_aww/**/*", "pyproject.toml"] 

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
