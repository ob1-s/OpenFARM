name: OpenFARM real media inspection
on:
  push:
    branches: [research/system1-reboot-2026-10]
    paths:
      - scripts/audit_openfarm_media.py
      - .github/workflows/openfarm-media-audit.yml
  workflow_dispatch:
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'datasets>=4.5.0' 'huggingface_hub>=1.0.0' pillow numpy soundfile
      - name: Inspect decoded images/audio and generate sample contact sheets
        run: python scripts/audit_openfarm_media.py --output-dir audit-media
      - name: Save research-only inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfarm-media-audit-contact-sheets
          path: audit-media/
          retention-days: 14

  sheep-near-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'datasets>=4.5.0' 'huggingface_hub>=1.0.0' pillow numpy
      - name: Inspect full Sheep APR image near-duplicate cross-split pairs
        run: python scripts/diagnose_sheep_images.py --output audit-reports/sheep-near-duplicates.json
      - name: Retain diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfarm-sheep-perceptual-audit
          path: audit-reports/sheep-near-duplicates.json
          retention-days: 14
