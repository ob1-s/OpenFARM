name: HotPig feeder decision candidate
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/evaluate_hotpig_feeder_candidate.py
      - .github/workflows/openfarm-hotpig-candidate.yml
  workflow_dispatch:
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' numpy requests
      - name: Screen simple reference rule on pig-heldout sensor observations
        run: python scripts/evaluate_hotpig_feeder_candidate.py --output audit-reports/hotpig-feeder-candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfarm-hotpig-feeder-candidate
          path: audit-reports/hotpig-feeder-candidate.json
          retention-days: 30
