[project]
name = "sheep-apr-grounded"
description = "Sheep Pain Recognition Benchmark."
tags = ["animal-behavior", "animal-welfare", "livestock", "automated-pain-recognition", "vision", "multimodal", "eval"]
version = "0.1.1"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
    "Pillow>=12.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "sheep_apr_grounded/**/*",
    "pyproject.toml",
    "README.md"
]
[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
