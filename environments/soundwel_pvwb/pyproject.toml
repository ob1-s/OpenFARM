[project]
name = "soundwel-pvwb"
description = "Porcine Vocal Welfare Benchmark — multi-task audio eval suite for pig vocalization understanding"
tags = ["animal-welfare", "audio", "multimodal", "eval", "benchmark", "livestock"]
version = "0.1.2"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.12",
    "Pillow>=12.2.0",
    "datasets",
    "soundfile",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["soundwel_pvwb.py", "utils.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 3
