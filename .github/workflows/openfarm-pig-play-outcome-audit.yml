name: OpenFARM independent pig play and clinical outcomes audit
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths: [scripts/audit_pig_play_clinical.py, .github/workflows/openfarm-pig-play-outcome-audit.yml]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' requests openpyxl
      - run: python scripts/audit_pig_play_clinical.py --output audit-reports/pig-play-clinical.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pig-play-clinical-data-evidence
          path: audit-reports/pig-play-clinical.json
          retention-days: 30
