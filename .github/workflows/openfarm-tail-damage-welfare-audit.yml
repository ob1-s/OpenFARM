name: Welfare sprint real pig tail-damage treatment outcome audit
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/audit_pig_tail_damage_outcomes.py
      - .github/workflows/openfarm-tail-damage-welfare-audit.yml
  workflow_dispatch:
jobs:
  pen-event-source:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' requests
      - run: python scripts/audit_pig_tail_damage_outcomes.py --out reports/pig-tail-injury-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pig-injury-treatment-onsets-audit
          path: reports/pig-tail-injury-source.json
          retention-days: 30
