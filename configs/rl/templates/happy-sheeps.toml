model = "Qwen/Qwen3.5-4B"
max_steps = 100
batch_size = 256
rollouts_per_example = 8

# learning_rate = 1e-4
# lora_alpha = 16
# oversampling_factor = 2.0
# max_async_level = 2
# env_file = ["secrets.env"] # optional file(s) for keys/secrets

[sampling]
max_tokens = 512

[[env]]
id = "primeintellect/alphabet-sort"
args = { dataset_id = "oliveirabruno01/sheep-facial-expression", format_reward_weight = 0.2 }

[eval]
interval = 20

[[eval.env]]
id = "primeintellect/eval-env"
args = { dataset_id = "oliveirabruno01/sheep-facial-expression-benchmark", format_reward_weight = 0.0, seed = 67 }
num_examples = 30
rollouts_per_example = 3
