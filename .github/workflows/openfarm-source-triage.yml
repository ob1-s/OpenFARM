name: OpenFARM scientific source triage
on:
  push:
    branches: [research/system1-reboot-2026-10]
    paths: ['scripts/triage_decision_sources.py', '.github/workflows/openfarm-source-triage.yml']
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dataset: [soundwel, horse, cat, hen, dog, ungulate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'datasets>=4.5.0' 'huggingface_hub>=1.0.0'
      - name: Profile source and metadata shortcuts at pinned revisions
        run: python scripts/triage_decision_sources.py --dataset "${{ matrix.dataset }}" --output "source-audit/${{ matrix.dataset }}.json"
      - name: Save triage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "openfarm-source-triage-${{ matrix.dataset }}"
          path: "source-audit/${{ matrix.dataset }}.json"
          retention-days: 14
