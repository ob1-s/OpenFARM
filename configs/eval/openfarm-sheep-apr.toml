endpoints_path = "../endpoints.toml"

num_examples = 64
rollouts_per_example = 3
max_concurrent = 32
max_retries = 5

save_results = true

[[ablation]]
env_id = "openfarm-sheep-apr"

[ablation.env_args]
modality = "vision"
judge_mode = "none" # "self" | "external" | "none"
require_explanation = true
max_examples_per_task = 64
seed = 42

[ablation.sweep]
endpoint_id = [
    "Qwen/Qwen3.5-2B",
    "google/gemini-3-flash-preview",
]
sampling_args = [
    { extra_body = { chat_template_kwargs = { enable_thinking = false } } },
]