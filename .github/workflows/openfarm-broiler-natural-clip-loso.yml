name: OpenFARM Big Broiler all-source geometry LOSO original annotations
on:
  push:
    branches: [research/index-behavior-to-care-2026-10]
    paths:
      - scripts/index_behavior_broiler_natural_loso.py
      - .github/workflows/openfarm-broiler-natural-clip-loso.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-annotation-video-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original archive ranged-reader and classical models
        run: |
          python -m pip install "remotezip>=0.12,<1" "requests>=2.31,<3" "pandas>=2.1,<3" "numpy>=1.26,<3" "scikit-learn>=1.5,<2" "pyarrow>=15"
      - name: Retrieve only original checksum-pinned dataset manifest via ZIP byte-range
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from remotezip import RemoteZip
          from scripts.index_behavior_broiler_source_audit import SOURCE_URL,MANIFEST_SHA256
          with RemoteZip(SOURCE_URL,initial_buffer_size=4*1024*1024) as z:
              names=[n for n in z.namelist() if n.endswith('dataset_manifest.csv')]
              if len(names)!=1:raise ValueError('Original manifest ambiguous')
              raw=z.read(names[0])
          if hashlib.sha256(raw).hexdigest()!=MANIFEST_SHA256:raise ValueError('Manifest changed')
          p=Path('data/broiler/cache/manifest.csv');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw)
          print('SOURCE_ORIGINAL_MANIFEST_OK',len(raw))
          PY
      - name: Authenticate all original 102 annotation CSVs and prepare ephemeral local cache
        run: python scripts/index_behavior_broiler_source_audit.py
      - name: Fit 92 source-video-heldout geometry benchmarks and LOSO specialists
        run: python scripts/index_behavior_broiler_event_benchmark.py
      - name: Aggregate full-clip LOSO and video-cluster uncertainty without selecting positive videos
        run: python scripts/index_behavior_broiler_natural_loso.py
      - name: Upload aggregate-only evidence (never cache, raw rows, video or feature arrays)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-broiler-92-clip-loso-no-enrichment-aggregate
          path: |
            reports/index_behavior_broiler_source_audit.json
            reports/index_behavior_broiler_event_benchmark.json
            reports/index_behavior_broiler_natural_clip_loso.json
          retention-days: 30
          if-no-files-found: ignore
