name: OpenFARM Stage B matched two-species neural falsification
on:
  push:
    branches: [research/index-alpha-model-gate-2026-10-19]
    paths:
      - scripts/index_alpha_stage_b.py
      - .github/workflows/openfarm-index-alpha-stage-b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-b-original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENFARM_HOTPIG_SOURCE_PATH: .cache/hotpig/series.zip
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical baselines and CPU-only neural framework
        run: |
          python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2' requests
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: .cache/hotpig/series.zip
          key: hotpig-17090997-series-1ba5125167224b96-v1
      - run: python -m py_compile scripts/index_alpha_stage_b.py
      - name: Run matching original-author data; select NN checkpoint using calibration animals only
        run: python scripts/index_alpha_stage_b.py --out reports/index-alpha/stage-b-source-matched.json
      - name: Publish aggregate scorecards only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfarm-stage-b-two-species-source-matched
          path: reports/index-alpha/stage-b-source-matched.json
          retention-days: 60
          if-no-files-found: ignore
