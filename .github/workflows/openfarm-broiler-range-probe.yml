name: Big Broiler 33GB range-based annotation probe
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths: [scripts/probe_broiler_range.py, .github/workflows/openfarm-broiler-range-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'remotezip>=0.12'
      - run: python scripts/probe_broiler_range.py
