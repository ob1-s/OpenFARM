name: Welfare sprint actual treated-pen history cheap baseline study
on:
  push:
    branches: [research/2026-10-data-prospecting]
    paths:
      - scripts/benchmark_swedish_tail_damage_warning.py
      - .github/workflows/openfarm-tail-damage-baselines.yml
  workflow_dispatch:
jobs:
  heldout-pen-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3' numpy scikit-learn requests
      - run: python scripts/benchmark_swedish_tail_damage_warning.py --out reports/pen-injury-treatment-research-baselines.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pen-tail-damage-case-control-historical-baselines
          path: reports/pen-injury-treatment-research-baselines.json
          retention-days: 30
